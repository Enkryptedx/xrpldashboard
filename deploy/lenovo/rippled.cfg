# ================================================================
# Lenovo rippled.cfg
# Source of truth: docs/NODE_AUDIT_PRE_MIGRATION.md §6
# Migration source: Mac rippled 3.2.0 @ ~/.config/rippled/rippled.cfg
# Every setting labelled: DELIBERATE / DEFAULT / LENOVO-NEW
# Deployed: 2026-08-01 first-boot on Lenovo IdeaCentre Mini 01IRH10R
#
# Note: standalone-value stanzas ([ledger_history], [fetch_depth], etc.)
# do NOT accept inline `# comment` after the value — rippled's parser
# reads the whole line as the value and lex_cast fails. Comments live
# above each stanza header.
# ================================================================

[server]
port_rpc_admin_local
port_peer
port_ws_admin_local
port_rpc_public_lan
port_ws_public
# 2026-09-02: [port_ws_public] added as on-box sovereign WS for the
# xrpld-xrpl-stream service (loopback-only, non-admin) — the earlier
# "DELIBERATE: no public API surface" note referred to WAN exposure,
# which this stanza does not have.

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http
# All DEFAULT. Loopback only for RPC.
# NOTE: cross-machine RPC from Mac walkers → Lenovo node — either
# (a) SSH tunnel from Mac (recommended), or
# (b) bind ip = 0.0.0.0 + admin = <Mac LAN IP> + LAN firewall.

[port_rpc_public_lan]
port = 5006
ip = 192.168.40.95
protocol = http
# 2026-08-31: non-admin RPC for Mac walker LAN reads.

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer
# All DEFAULT. Accept inbound peers.

[port_ws_admin_local]
port = 6006
ip = 127.0.0.1
admin = 127.0.0.1
protocol = ws
# All DEFAULT. No send_queue_limit — DROPPED Mac's WORKAROUND value of 500.
# 29-walker contention doesn't exist on this box. Default 100 is fine.

[port_ws_public]
port = 6007
ip = 127.0.0.1
protocol = ws
send_queue_limit = 500
# 2026-09-02: added for on-box xrpld-xrpl-stream (transactions stream
# subscriber). Loopback-only, non-admin — nothing off-box can reach it
# and the subscriber cannot invoke admin methods.
# 2026-09-05: send_queue_limit = 500 added after the default (100)
# caused rippled to kick the subscriber ~400/hr with "Policy error:
# client is too slow" (see rippled debug.log correlation). Same value
# as the Mac-era workaround from [port_ws_admin_local] that was dropped
# in the Lenovo repoint but is genuinely needed for the tx stream on
# this port. Guarded by rippled_cfg_drift_guard.

[node_db]
type = NuDB
path = /var/lib/rippled/db/nudb
online_delete = 50000
advisory_delete = 0
cache_size = 16384
cache_age = 5
# type: DELIBERATE (correct for non-validator + SSD)
# path: LENOVO-NEW (dedicated LV, ext4)
# online_delete: DELIBERATE — Option A ratified 2026-08-01, ~13.5h retention
# cache_size + cache_age: LENOVO-NEW — Mac omitted as RAM workaround; add on 32GB box

# LENOVO-NEW path (dedicated LV)
[database_path]
/var/lib/rippled/db

# LENOVO-NEW path — Ubuntu logrotate handles rotation
[debug_logfile]
/var/log/rippled/debug.log

# LENOVO-NEW — was 'medium' on Mac (RAM WORKAROUND); 32GB dedicated → huge
[node_size]
huge

# DELIBERATE — matches online_delete (Option A ratified)
[ledger_history]
50000

# DELIBERATE — matches ledger_history (Option A ratified)
[fetch_depth]
50000

# LENOVO-NEW — Mac was absent (default ~21); raise for network citizenship + sync resilience
[peers_max]
50

# DEFAULT — resolves to /etc/rippled/validators.txt
[validators_file]
validators.txt

# LENOVO-NEW — was 'warning' on Mac (disk-savings WORKAROUND); 'info' on dedicated box for visibility
[rpc_startup]
{ "command": "log_level", "severity": "info" }

# DEFAULT
[ssl_verify]
1

# [ssl_verify_file] — INTENTIONALLY OMITTED.
# Mac had /etc/ssl/cert.pem WORKAROUND (macOS OpenSSL didn't find system CAs).
# Ubuntu OpenSSL should find /etc/ssl/certs/ca-certificates.crt automatically.
# If validator list HTTPS fetches fail on Lenovo, add:
#   [ssl_verify_file]
#   /etc/ssl/certs/ca-certificates.crt
