# XRP Ledger Configuration for TickTap
# This file declares XRP Ledger-related configuration for the domain

# Basic information
[domain]
name = "pay.aiic.nz"
description = "TickTap - Multi-currency payment platform with XRP Ledger integration"

# Currency information
[currency]
# XRP (native currency)
[currency.xrp]
code = "XRP"
issuer = ""
decimals = 6
symbol = "XRP"

# Custom tokens
[currency.nzd]
code = "NZD"
issuer = "rsMrj3r4oNzcmaWqVGqPMSKx1BTE6v6NZD"
