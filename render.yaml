# Render.com infrastructure-as-code config for xrpldashboard.
# Render reads this file when you connect the repo and provisions
# the service automatically. Push to git → Render redeploys.
#
# Plan: starter ($7/mo) keeps the service warm 24/7 (the free tier
# sleeps after 15 min of inactivity, which kills a "live dashboard").
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: xrpldashboard
    runtime: python
    plan: starter

    # Build: install pinned dependencies.
    buildCommand: pip install -r requirements.txt

    # Run: gunicorn binds to Render's $PORT, 2 workers, 60s timeout.
    # 2 workers handles concurrent visitors well at this scale; bump if
    # CPU saturates. Threads=4 lets each worker handle several
    # blocked-on-XRPL requests in parallel without spawning more processes.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile -

    # Health check — Render hits this URL to verify the service is up
    # before routing traffic. /healthz returns 200 without doing an
    # XRPL scan, so it's fast and won't false-fail during XRPL outages.
    healthCheckPath: /healthz

    # Pin Python version. 3.14 is brand new and not yet on Render;
    # 3.12 is the current stable default and works fine for our deps.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Cache TTL for XRPL scans. 60s = data is at most 60s stale,
      # XRPL gets one scan per minute regardless of traffic.
      - key: SCAN_CACHE_TTL_SECONDS
        value: "60"

      # Production = no debug mode.
      - key: FLASK_DEBUG
        value: "0"

      # DATABASE_URL is set in the Render dashboard (sync: false means
      # "must be set there, never committed"). Same Neon URL is used by
      # both the web service and the worker.
      - key: DATABASE_URL
        sync: false

    # Auto-deploy on every push to the connected branch.
    autoDeploy: true

  # ====================================================================
  # XRPL stream worker — ENABLED 2026-05-09.
  #
  # Lives on Render so the site stays fresh when Charlie's Mac is off.
  # Subscribes to the public XRPL transaction stream and writes whales,
  # token volumes, and AMM events to the same Neon Postgres the web
  # service reads from.
  #
  # IMPORTANT: when this is running, the launchd plists on Charlie's
  # Mac MUST be unloaded — otherwise both workers will write to Neon
  # and produce duplicate events / double-counted token volumes:
  #   launchctl unload ~/Library/LaunchAgents/com.charliebruce.xrpldashboard.xrpl_stream.plist
  #   launchctl unload ~/Library/LaunchAgents/com.charliebruce.xrpldashboard.rank_amms.plist
  # ====================================================================
  - type: worker
    name: xrpldashboard-stream
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python xrpl_stream.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false

  # ====================================================================
  # AMM TVL ranker — periodic cron. Walks every XRPL AMM pool, computes
  # TVL, writes a fresh snapshot to amm_ranked_pools (the /pools surface).
  # Schedule matches the previous launchd plist: every 4 hours.
  # ====================================================================
  - type: cron
    name: xrpldashboard-rank-amms
    runtime: python
    plan: starter
    schedule: "0 */4 * * *"   # top of every 4th hour, UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python rank_amms.py --reset
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
