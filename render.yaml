# Render.com infrastructure-as-code config for xrpldashboard.
# Render reads this file when you connect the repo and provisions
# the service automatically. Push to git → Render redeploys.
#
# Plan: standard ($25/mo, 2 GB RAM, 1 CPU). Bumped from starter after the
# 2026-08-15 OOM incident — starter's 512MB ceiling was being exceeded at
# baseline load (accumulated whales cache + ranked snapshot cache + module
# state + concurrent renders pushed past the limit; Render notifications
# confirmed "used over 512MB" twice in one window). This yaml MUST match the
# dashboard tier: Render's blueprint sync overwrites dashboard changes on
# every deploy per https://render.com/docs/infrastructure-as-code, so
# `plan: starter` here would silently downgrade the service the next time
# anyone pushes to main.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: xrpldashboard
    runtime: python
    plan: standard

    # Build: install pinned dependencies, then generate the static search
    # index from glossary.json + CLAIMS.yaml. Deploy fails if either
    # source is missing or malformed (build_search_index.py exits non-zero).
    buildCommand: pip install -r requirements.txt && python scripts/build_search_index.py

    # Run: gunicorn binds to Render's $PORT.
    # 3 workers x 8 threads = 24 concurrent request slots.
    # 30s timeout kills any hung request before Render's health-check
    # failure ratio crosses the SIGTERM threshold (2026-08-19 flap-storm:
    # 2x4=8 slots + 60s timeout let a small number of hung requests
    # starve the pool for minutes, triggering three BetterStack incidents
    # inside 20 minutes with public 502 confirmed on 6/6 external nodes).
    # Interim: mechanism not yet named; larger pool + shorter timeout
    # stops the bleeding while the root cause hunt continues.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 3 --threads 8 --timeout 30 --access-logfile -

    # Health check — Render hits this URL to verify the service is up
    # before routing traffic. /healthz returns 200 without doing an
    # XRPL scan, so it's fast and won't false-fail during XRPL outages.
    healthCheckPath: /healthz

    # Pin Python version. 3.14 is brand new and not yet on Render;
    # 3.12 is the current stable default and works fine for our deps.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Cache TTL for XRPL scans. 60s = data is at most 60s stale,
      # XRPL gets one scan per minute regardless of traffic.
      - key: SCAN_CACHE_TTL_SECONDS
        value: "60"

      # Production = no debug mode.
      - key: FLASK_DEBUG
        value: "0"

      # DATABASE_URL is set in the Render dashboard (sync: false means
      # "must be set there, never committed"). Same Neon URL is used by
      # both the web service and the worker.
      - key: DATABASE_URL
        sync: false

      # Session-scraper block: armed. Charlie ruling 2026-09-21 Mon PM
      # after the /healthz 429 near-miss required a log-only 24h
      # window; and 2026-09-22 Tue midday after the shadow list came
      # back clean (only Lightpanda/1.0 pattern, no monitors, no real
      # browsers). Both filters are now enforcing.
      - key: SCRAPER_TRACKER_LOG_ONLY
        value: "0"

      # Disguised-Chrome fleet block: armed. Shadow list yesterday was
      # 32 hits, all Lightpanda/1.0 on /, /amendments, /check, /llms.txt.
      # No BetterStack, Render, or real-browser UAs in the block set.
      # Flipping to enforce takes those from 429 (rate-limited already)
      # to a clean 403 at request-path, saving downstream cycles.
      - key: FLEET_DISGUISED_CHROME_ENFORCE
        value: "1"

      # Crawler-identity check (reverse-DNS forgery detection): ships
      # log-only per the standing request_path_filter_log_only_first
      # rule. CRAWLER_FORGERY_SHADOW: log lines emitted for 24h;
      # flip to "1" 2026-09-23 after Charlie reviews the shadow list
      # and confirms no monitors / real-crawler-atypical-IPs are in
      # the block set. Motivating incident: 13 GPTBot-claiming requests
      # probed /.env / /firebase-admin.json / /awsConfig.js /
      # /actuator/threaddump on 2026-09-21 — real GPTBot doesn't do
      # that.
      # Flipped 0 → 1 by Charlie ruling 2026-09-23 Wed 06:44 ET. Shadow
      # table (crawler_forgery_shadow) had zero real forgery events in
      # the 8.5h since wiring landed (2026-09-23 02:16 UTC). Ten tracked
      # crawlers active in the window (ChatGPT-User, OAI-SearchBot,
      # Googlebot, ClaudeBot, Amazonbot, Applebot, bingbot, PerplexityBot,
      # GPTBot, Meta-ExternalAgent) — zero 403s across all of them.
      # rDNS check functionally silent on real crawler traffic; enforce
      # only affects requests whose PTR doesn't match their claimed UA
      # (the incident this rule was built for). Enforced verdicts still
      # land in crawler_forgery_shadow — revert here if a real crawler
      # shows up as verdict='enforced'.
      - key: CRAWLER_FORGERY_ENFORCE
        value: "1"

    # Auto-deploy on every push to the connected branch.
    autoDeploy: true

  # ====================================================================
  # NOTE: XRPL stream worker + AMM ranker cron live on Charlie's Mac
  # under launchd, NOT on Render. Both write to the same Neon Postgres
  # that this web service reads, so prod stays fresh without paying for
  # a second Render plan.
  #
  # The Render-hosted versions were removed 2026-05-11 because they
  # duplicated the Mac workers: the stream worker restart-looped every
  # ~6 min and kept zeroing the heartbeat counters (the /health page
  # was showing "0 large transfers / 0 token trades"), and the cron
  # ran in parallel with the launchd ranker producing duplicate writes.
  #
  # Mac plists:
  #   ~/Library/LaunchAgents/com.charliebruce.xrpldashboard.xrpl_stream.plist
  #   ~/Library/LaunchAgents/com.charliebruce.xrpldashboard.rank_amms.plist
  # ====================================================================
