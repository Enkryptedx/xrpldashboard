{# _cite_link.html — atomic citation links from displayed numbers to their CLAIMS.yaml entry.
   Usage: {% from "_cite_link.html" import cite_css, cite %}
          {{ cite_css() }}   (once per template, inside <style>)
          {{ cite('xrpl.rlusd.xrpl_supply', 'yellow') }}  (inline, after a number)
   tier values: green / yellow / red (mirrors sovereignty tier of the claim).
   URI scheme is permanent per claims_uri_scheme covenant — safe to hardcode. #}

{% macro cite_css() %}
.cite-link {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  text-decoration: none;
  margin-left: 5px;
  opacity: 0.5;
  vertical-align: super;
  line-height: 0;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.cite-link:hover { opacity: 1; text-decoration: none; }
.cite-link.green  { color: var(--green, #4ade80); }
.cite-link.yellow { color: var(--amber, #fbbf24); }
.cite-link.red    { color: var(--red,   #f87171); }
.cite-link.unknown{ color: var(--dim,   #7a8ca8); }
{% endmacro %}

{% macro cite(uri, tier='yellow') %}<a class="cite-link {{ tier }}" href="/claims/{{ uri }}" title="{{ uri }}" aria-label="claim: {{ uri }}">⊕</a>{% endmacro %}
