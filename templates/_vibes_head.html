{# Futuristic-tech vibes — head bits.
   Include in <head>, AFTER the page's own <style> block so the font
   token override wins via cascade. Drop on a page by deleting the
   include — every effect here is opt-in via include order. #}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css"
      integrity="sha384-UoVLAkO5axeZ40F8A8xhhriZNUtKgmSG4Ue6MEi7Xv2KbKdwmOTcfhkeZuf09Rwh"
      crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css"
      integrity="sha384-HYhuLi8gbUIFB7qI7h6aaSkOCl4lKe5iE8iCH1sil2VkcHpWxdcf8d8FO2v+x4ZX"
      crossorigin="anonymous">
<style>
  /* Geist swap — overrides whatever the page declared earlier. */
  :root {
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sys:  "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  html, body {
    font-family: var(--sys);
    font-feature-settings: "ss01", "cv11";
  }

  /* Ambient drifting grid behind everything. Masked to fade at edges
     so it never competes with content. */
  body { position: relative; isolation: isolate; }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(34,211,238,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 100%);
    animation: vibes-grid-drift 24s linear infinite;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes vibes-grid-drift {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 48px 48px, 48px 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
  }

  /* Page-wide cursor spotlight. Always visible, always follows the
     mouse — soft cyan radial that paints the whole viewport. JS sets
     --mx/--my on <html>. Sits on top of every surface with
     pointer-events:none and mix-blend-mode:screen, so dark cards
     beneath visibly brighten as the cursor passes over them. */
  html { --mx: 50vw; --my: 50vh; }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(
      420px circle at var(--mx) var(--my),
      rgba(34,211,238,0.22), transparent 62%);
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: screen;
  }
  @media (prefers-reduced-motion: reduce) {
    body::after { display: none; }
  }
  @media (hover: none) {
    /* Touch devices — no cursor, no spotlight. */
    body::after { display: none; }
  }

  /* Per-card cursor-tracking glow — fires on :hover so the surface the
     user is actually pointing at "lights up". JS sets --vx/--vy on the
     element. Stacks on top of the body spotlight. */
  .vibes-spot,
  .stat-pill {
    position: relative; overflow: hidden;
  }
  .vibes-spot::before,
  .stat-pill::before {
    content: "";
    position: absolute; inset: -1px;
    border-radius: inherit;
    background: radial-gradient(
      380px circle at var(--vx, 50%) var(--vy, 50%),
      rgba(34,211,238,0.32), transparent 58%);
    opacity: 0; transition: opacity 0.18s;
    pointer-events: none;
  }
  .vibes-spot:hover::before,
  .stat-pill:hover::before { opacity: 1; }
  .vibes-spot:hover,
  .stat-pill:hover {
    border-color: rgba(34,211,238,0.35);
    box-shadow: 0 0 0 1px rgba(34,211,238,0.18),
                0 8px 24px -8px rgba(34,211,238,0.25);
    transition: border-color 0.18s, box-shadow 0.18s;
  }

  /* When an explainer popover opens inside a spot/pill, escape the
     overflow:hidden clip AND hoist the tile above later positioned
     siblings (event rows, list items) that would otherwise paint
     on top of the popover. */
  .vibes-spot:has(.explainer[open]),
  .stat-pill:has(.explainer[open]) { overflow: visible; z-index: 100; }
</style>
