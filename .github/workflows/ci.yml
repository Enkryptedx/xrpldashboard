name: CI

# Charlie ruling 2026-09-25 (item 4). Motivating incident: /rwa served
# 100% 5xx for ~55h (9e3620d 2026-09-22 -> e03829d 2026-09-24) because a
# broken template merged to main and Render auto-deployed it with nothing
# running the tests. test_routes.py::test_trust_critical_page_renders_200[/rwa]
# existed and would have caught it — but no CI ran it. This closes the
# PREVENTION gap (the route canary added the same day closes DETECTION).
#
# Scope (deliberately conservative on day one):
#  - render-killer tests only (trust_critical + amendment), NOT the full
#    62-file suite — those are the ones that catch a public 500. Widen
#    later once green and trusted.
#  - NO DATABASE_URL: the trust-critical render tests must pass with no DB
#    (routes are wrapped to not-500 on DB errors — that's the property we
#    protect). A test that needs the DB to pass is a FINDING to fix, not a
#    secret to wire into CI.
#  - Python 3.12.7 to match render.yaml PYTHON_VERSION.
#
# This workflow only RUNS tests; it gates nothing yet. The deploy gate
# (Render "Wait for CI") is enabled separately in the Render dashboard by
# Charlie AFTER the first green run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trust-critical-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install pinned dependencies + test tooling
        run: pip install -r requirements-dev.txt
      - name: Trust-critical render tests (no DB)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_routes.py -k "trust_critical or amendment" tests/test_amendments_no_uncatalogued_in_flight.py tests/test_amm_ranked_pools_projection.py -q
      # Sovereignty sourcing locks (GAP-1 / GAP-2, 2026-09-25). Hermetic:
      # every RPC + the walker_node_fallback writer is patched, no DB, no
      # network. A red here means a raw public read crept back into a
      # surface the audit table marks sovereign-first.
      - name: Sovereignty sourcing tests (no DB, no network)
        env:
          DATABASE_URL: ""
        run: |
          pytest tests/test_bridge_signer_sourcing.py tests/test_credentials_sourcing.py tests/test_amm_ranking_sourcing.py tests/test_nft_activity_sourcing.py tests/test_public_analytics_filters.py -q
          python tests/test_network_pulse_sourcing.py
      # Option B relay (Milestone 1 filters + Milestone 2 named-feed relay +
      # canary feed probes). Loopback-only fake upstream, no DB, no internet.
      # This is the "CI green with the relay code merged" precondition in
      # docs/OPTION_B_MILESTONE2_RELAY_DIFF.md §6 before any Lenovo deploy.
      - name: Live-stream relay tests (loopback, no DB)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_relay_feed_filters.py tests/test_live_stream_relay.py tests/test_live_stream_relay_feeds.py tests/test_wss_relay_canary_feeds.py -q
      # RLUSD rolling-24h verification gates (2026-10-06). Hermetic: the XRPL
      # JSON-RPC and Etherscan surfaces are both stubbed, no DB, no network.
      # Motivating incident: /rlusd published a two-chain "net supply change
      # · 24h" of +$66,594,743, of which +$61.6M came from a boundary ledger
      # resolved weeks off target. A red here means an unverified supply-change
      # figure can reach the page again. These files were previously run only
      # by hand — no CI job referenced them.
      - name: RLUSD rolling-24h gate tests (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_rlusd_rolling_gate.py tests/test_rlusd_eth_rolling_gate.py -q
      # /thisweek edition-page wrap locks (added with b56f566, registered
      # 2026-10-06). Kept as its own step rather than folded into the RLUSD
      # one: unrelated surface, and a red here should name the /thisweek page
      # directly instead of pointing at an RLUSD gate. Hermetic — reads the
      # template from disk, no DB, no network. Guards against long hashes and
      # archive URLs overflowing the viewport on a phone, and against the wrap
      # rule leaking off .content onto every other page.
      - name: /thisweek wrap tests (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_thisweek_long_token_wrap.py -q
      # RLUSD label scope (2026-10-06). Separate from the gate step above:
      # that one guards the NUMBERS, this one guards what the numbers CLAIM
      # to measure. Two true RLUSD figures read as contradictory because
      # neither said its chain or its window — the homepage item is XRPL-only
      # between two 21:00 ET signed leaves, the /rlusd cells are both chains
      # on a rolling window ending now. A red here means a figure has lost
      # its scope label again. Hermetic: template read from disk, no DB,
      # no network.
      - name: RLUSD label scope tests (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_rlusd_label_scope.py -q
      # /changes.xml query budget (2026-10-07). The feed used to do 1 + 30 = 31
      # SERIAL reads, each on its own short-lived connection (db.pg_connect
      # does not pool). From Render to Neon that was ~15s per cold build and it
      # raced the route canary's 15.0s timeout -- network_ReadTimeout at
      # 06:06:30 ET. This step pins TWO things: the build stays within a
      # 2-query budget, and its bytes still match the per-date rendering
      # including the disclosed-corrections overlay. A red here means either
      # the fanout came back or the feed drifted from the /changes pages.
      - name: /changes.xml query budget + byte-identity (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_changes_xml_batch.py -q
      # Amendment ENABLED vs LOST (2026-10-07). The majority walker used to
      # stamp removed_* for ANY hash that left the ledger's Majorities array,
      # so an amendment that completed its 14-day window and turned ON would
      # have been shown on /amendments as "majority lost — superseded" on the
      # day it went live (PermissionDelegationV1_1, Thu Oct 8 21:25 UTC). This
      # step pins: Amendments-array membership -> enabled_*; in neither array
      # -> removed_*; two activations on different flag ledgers keep their own
      # ledger + close time; the history row and dated permalink render the
      # enabled state ET-first and never say "lost". Hermetic: RPC + DB faked.
      - name: Amendment majority walker enabled-vs-lost (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_amendment_majority_walker_enabled.py -q
      # /changes amendment activations (2026-10-07). The builder used to
      # hard-code `amendments` as a no-change category, so an activation day
      # read "No change: … amendments". Now an amendment_majority_history row
      # with enabled_iso inside the day's leaf-to-leaf window emits one item
      # (name, ET-first time, ledger, /amendments/<date> proof) and takes a
      # strip slot as an anomaly. Pins: one-in-window shows, outside-window
      # doesn't, two-in-window both show in ledger order (the Friday case),
      # none keeps "no change", loader failure is soft. Hermetic: fake PG.
      - name: /changes amendment activations (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_changes_amendment_enabled.py -q
      # /amendments minute/minutes wording (2026-10-07). The roll-call card
      # printed "in about 1 minutes" / "0 minutes ago" / "minutes remaining
      # 1.0". Pins the approved forms through the real template + ngettext:
      # 1 -> "in about 1 minute" / "1 minute ago"; 0 -> "in less than a
      # minute" / "less than a minute ago"; 2+ unchanged. No DB, no network.
      - name: /amendments minute/minutes plural wording (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_amendments_minute_plural.py -q
      # Audit quick fixes (2026-10-08): /mpts JS-"undefined" display trim,
      # /changes + /coverage broken links, phone table scroll boxes on five
      # pages. Hermetic: fake PG, no network.
      - name: audit quick fixes 2026-10-08 (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_audit_quick_fixes_2026_10_08.py -q
      # /token route guard (2026-10-08 incident 14:49 ET): per-worker
      # non-blocking concurrency cap -> immediate 503 + Retry-After; amm_info
      # from the web path bounded to 5 s / 1 tunnel try. Hermetic.
      - name: /token route guard (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_token_route_guard.py -q
      # Roll-call table (2026-10-08): enabled amendments keep their name and
      # show state "enabled" — no bare hash / stale "majority". Hermetic.
      - name: roll-call enabled-amendment name + state (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_roll_call_card.py tests/test_amendments_rollcall_enabled_name.py -q
      # amendments vote/state caches (2026-10-08): upstream fetch runs
      # OUTSIDE the lock; last good data served while one background
      # refresh runs; failures never cached. Hermetic (patched httpx).
      - name: amendments caches non-blocking (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_amendments_network_votes_nonblocking.py tests/test_amendments_network_votes.py -q
      # Majority walker (2026-10-08): record the TRUE enable point — the
      # EnableAmendment pseudo-tx ledger/time/hash — and backfill observed
      # rows; page shows it with a tx link. Hermetic (fake RPC + DB).
      - name: majority walker true enable point (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_amendment_majority_walker_true_enable.py tests/test_amendment_majority_walker_enabled.py -q
      # /amendments "Just went LIVE" box (2026-10-09). Motivating incident:
      # PermissionDelegationV1_1 activated 2026-10-08 5:29:50 PM ET and its
      # countdown card VANISHED, because cards are driven by the ledger's
      # Majorities array and an activation removes the hash from it. Pins:
      # a 48h-window activation renders with name + green LIVE tag +
      # ET-first time + true enable ledger + EnableAmendment tx link; an old
      # activation and a non-enabled row do not; the box hides when empty but
      # the 30s poll still runs; the page and the poll endpoint agree on the
      # fingerprint (a mismatch would reload forever); the poll endpoint is
      # edge-cached and never 500s; a helper failure never 500s /amendments.
      # Hermetic: fake state + fake history, no DB, no network.
      - name: /amendments just-went-LIVE box + 30s poll (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_amendments_live_banner.py tests/test_amendments_live_banner_render.py -q
      # /amendments approved wording (2026-10-09). Motivating fact:
      # fixCleanup3_4_0 took its majority on 28 yes while our node heard all
      # 35 validators and the page computed "needs 29" from the published
      # UNL size — our count and the ledger's decision can disagree. Pins:
      # the needs-line is attributed "by our node's count"; the ledger's
      # Majorities decision renders as the final word; spare-votes wording
      # above / at / below the bar (incl. the 1-vote singular); the three
      # retired sentences stay gone; "majority reached" drops "at fetch".
      # Hermetic: fake rounds + fake PG, no DB, no network.
      - name: /amendments wording + spare votes (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_amendments_wording_2026_10_09.py tests/test_roll_call_card.py -q
      # /amendments "Recently enabled" is now a dated, data-driven list
      # (2026-10-09) instead of a static paragraph plus one generic
      # all-steps-DONE specimen timeline. Pins: 30-day window; newest
      # first; name + true enable time + ledger + EnableAmendment tx; the
      # 48h banner's hashes are excluded so one activation is never listed
      # twice; the 48h->list handover; undated and pending rows never
      # reach a dated list; the hand-written paragraph survives (incl.
      # when the list is empty); the DONE-steps example is gone; a helper
      # failure never 500s the page. Hermetic: fake history, no DB.
      - name: /amendments recently-enabled list (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_amendments_recently_enabled.py tests/test_amendments_live_banner.py -q
      # is_bot_canary's authoritative arm links sessions with two IN
      # subqueries over all of page_views. Undeduped, Postgres materialised
      # ~285k hash rows and rescanned them per outer row (plan cost 716M),
      # blowing the 25s statement_timeout on 2026-10-09 and opening a
      # BetterStack incident. DISTINCT drops it to 485k cost. Pins: both
      # arms deduped; the SQL is byte-identical to the pre-fix fixture once
      # the two DISTINCT tokens are removed (so the comparison arm's
      # semantics are provably unchanged); params unchanged; all four
      # classifier arms survive; the session arms stay unbounded in time
      # (the rejected alternative fix). Hermetic: fake conn, no DB.
      - name: is_bot_canary session-arm dedupe (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_is_bot_canary_distinct.py -q
      # db._bot_filter_sql's tier-4 fallback carried the identical undeduped
      # session subqueries as the canary arm fixed above. Dormant (tier 1,
      # _is_bot_column_ready=True, serves prod), so the 716M plan was never
      # live — but a flag flip would hand it to the site. Pins: both tier-4
      # arms deduped; SQL byte-identical to the pre-fix fixture once the two
      # SELECT DISTINCT tokens are reduced, across human/bot x cohort-on/off;
      # params unchanged incl. the scanner ts bound (clock frozen); the
      # scanner arm's PRE-EXISTING COUNT(DISTINCT ...) untouched (tier 4 had
      # 1 DISTINCT before, 3 after); tiers 1-3 and the lite filter unchanged;
      # session arms stay unbounded in time. Hermetic: no DB, no network.
      - name: bot filter tier-4 fallback dedupe (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_bot_filter_tier4_distinct.py -q
      # refresh_bot_hash_tables() used to DELETE every row of
      # page_view_bot_hashes and re-INSERT the lot every 5 min. Measured
      # 2026-10-10: 79,901 rows held, 6 changed per cycle (0.008%) =>
      # ~46.0M row-writes/day to apply ~1,700, matching the ~360M/~355M
      # pg_stat_statements counters over ~15.5 days. Now diff-synced. Pins:
      # final contents == desired for adds/removes/mixed/no-change/populate/
      # drain (the old rebuild's postcondition WAS `desired`, so that is the
      # equivalence check); a no-change cycle emits ZERO writes; write volume
      # tracks the delta not the table size; never TRUNCATE nor a bare
      # DELETE; ON CONFLICT DO NOTHING so a retried cycle is idempotent;
      # batches stay under the int16 param ceiling that silently no-opped
      # the refresh on 2026-09-05. Hermetic: fake cursor models the table.
      - name: bot-hash tables diff-based upsert (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_bot_hashes_upsert.py -q
      # /institutional Evernorth card data module. Pins: filing facts each
      # carry a citation; the attributed-wallet tier is never presented as
      # filing-confirmed; an unreadable balance is excluded, never counted
      # as zero; and build_moves names a counterparty ONLY when it is a
      # first-party labelled account — an unlabelled address stays bare,
      # because a label that reads like a fact is worse than no label.
      # Hermetic: fake readers and plain dicts, no DB, no network.
      - name: institutional treasuries card data (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_institutional_treasuries.py -q
      # Evernorth daily treasury snapshot: Postgres writer + reader. Pins the
      # UPSERT on snapshot_date (a retry must overwrite, not add a second
      # point to the card's history line), json.dumps + ::jsonb as this
      # module's house pattern (psycopg's Json adapter is NOT imported in
      # db.py, so using it would NameError at runtime - ast.parse cannot
      # catch that), an unreadable wallet stored as null and never 0, and
      # both sides degrading (silent no-op write, [] read) instead of
      # raising. Hermetic: fake connections, no DB, no network.
      - name: evernorth daily snapshot store (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_evernorth_daily_snapshot.py -q
      # The 21:30 ET snapshot job. The load-bearing pin is the date key:
      # 21:30 ET is ALREADY the next UTC day, so keying the row on UTC would
      # file every reading under tomorrow and the card's history would sit a
      # day ahead of its heading - a bug only visible between 20:00 ET and
      # midnight. Also pins unreadable-wallet -> null (never 0, which would
      # read as an outflow that never happened) and that a Postgres failure
      # still leaves the local JSON copy. Hermetic: fake reader, temp file.
      - name: evernorth snapshot job (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_evernorth_snapshot_job.py -q
      # The card's two read paths. These exist so /institutional renders from
      # Postgres ALONE - the nightly job is the only thing that may touch the
      # node, because a route that renders fine locally can still hang only
      # on Render (PR #28, /tokens). Pins: newest-row ordering in the query
      # rather than in the caller; jsonb balances usable as dict OR text;
      # unreadable wallet stays null, never 0; the moves query is XRP-only
      # (a token amount in amount_drops is not drops, and dividing it by 1e6
      # would print a number the ledger never stated); direction is relative
      # to OUR wallets and an internal wallet-to-wallet move carries no
      # counterparty. Hermetic: fake connections, no DB, no network.
      - name: evernorth card readers (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_evernorth_card_readers.py -q
      # Card assembly. The load-bearing pins are evidentiary, not cosmetic:
      # the live line is the owner's sentence VERBATIM (built in Python, not
      # in a gettext string - a dynamic number inside _() is %-in-gettext,
      # a known render-killer here); no row may carry the xrp-insights
      # naming convention, which on a public card would read as a
      # first-party fact about Evernorth's custody structure that no filing
      # supports; the two attribution groups keep their approved headings
      # and stay SEPARATE, so 11 inferred addresses are never laundered
      # into the 2 an explorer actually labelled; and the strongest tier
      # string stays unreachable from a row. Hermetic: plain dicts.
      - name: evernorth card assembly (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_evernorth_card_build.py -q
      # The rendered /institutional page, driven through the real route.
      # Distinct risk from the pure-assembly step above: a template can
      # reach for a field that does not exist, a later edit can print a
      # third-party wallet name, or the card can take the whole page down
      # when Postgres is unavailable. Pins the section's position, every
      # filing figure + its sec.gov citation link, the verbatim live line
      # and both verbatim group headings, that no full address appears as
      # visible text (only in href values), and that the page still
      # returns 200 with the filing facts when the data layer raises.
      # DB readers are stubbed with raising=True so a rename fails loudly
      # instead of silently reaching the live database.
      - name: institutional evernorth card render (no DB)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_institutional_evernorth_render.py -q
      # /whales side of the same ruling. Attribution is NOT a name: the row
      # keeps its bare short address and carries the GROUP's string, which
      # is the whole evidentiary claim. Pins both approved strings verbatim
      # and IDENTICAL to the card's (one table, two surfaces - they must
      # not drift), that the third party's names reach no field of a row,
      # that an unrelated address gets no attribution, and that the chip
      # stays inside its own <a class="addr"> above its own address - a
      # chip that escapes its anchor reads as the wrong side of the arrow
      # (the positional bug fixed in PR #15). Hermetic: fake rows, injected
      # render context, no DB and no node.
      - name: whales attributed wallets (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_whales_attributed_wallets.py -q
      # /amendments compact stepper (2026-10-04, repaired 2026-10-10).
      # Motivating fact: this file was RED and nobody knew, because it was
      # never registered here - an unnamed test file simply never runs.
      # Two stacked causes. (1) _amendments_rollcall_verdict.html (e31d3ee)
      # landed AFTER this file and reads rc_row.spare_votes; Jinja RAISES on
      # `Undefined > 0`, so one missing fixture key killed the ENTIRE
      # /amendments render and all 25 failures read as "nothing rendered".
      # (2) 56c6025 deleted the synthetic __enabled_example__ demo block, so
      # the helper that injected it became a silent NO-OP and four tests
      # failed looking exactly as if the OFFICIAL badge had been deleted. It
      # had not: tl.enabled is live at amendments.html:546/:557, so those
      # tests were RE-POINTED onto the real enabled render, not deleted.
      # Pins: six compact stops per card; step wording word-for-word against
      # a COMMITTED golden fixture (no `git show origin/main`, which skipped
      # silently on this runner's depth-1 checkout); the Item 5 singular;
      # step-2 gating; the OFFICIAL badge on step 5 only and never during
      # countdown; the pure-CSS check mark, now also asserted to be APPLIED
      # to real markup rather than merely defined in <style>.
      # Hermetic: injected context + committed fixture, no DB, no network,
      # and no git history (it must pass on a depth-1 clone).
      - name: /amendments compact stepper + step wording (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_amendments_compact_steps.py -q
      # Roll-call card route (repaired 2026-10-10). Motivating fact: this
      # test's load_for_page fake had gone stale - current_validated_ledger
      # was added to the real function, the route started passing it, the
      # fake raised TypeError, and the route's `except Exception: roll_call =
      # None` SWALLOWED it. So the card silently vanished and the test said
      # "the card did not render" instead of "your fake is stale", costing a
      # full diagnosis pass. The fake now binds the REAL signature inside
      # *args/**kwargs, so a newly added parameter can never break it
      # silently again. Pins the exact kwargs the route passes.
      # Hermetic: monkeypatched loader, no DB, no network.
      - name: roll-call card route + call shape (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_roll_call_card_route.py -q
      # Verdict-partial contract (new 2026-10-10). The fixture drift above
      # was only findable by hand, so this PARSES
      # _amendments_rollcall_verdict.html for every rc_row.* / roll_call.*
      # key it reads and asserts real build_card() supplies each one.
      # Deliberately not a hardcoded list of names - a hardcoded list drifts
      # exactly the way the fixtures did. Includes a guard-the-guard test so
      # an empty parse cannot pass vacuously.
      # Hermetic: template parse + real builder, no DB, no network.
      - name: roll-call verdict partial contract (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_rollcall_verdict_contract.py -q
      # Swallowed-failure logging (new 2026-10-10). The two render-killer
      # guards on /amendments deliberately swallow failures so the page never
      # 500s, but they logged NOTHING - a vanished roll-call card left no
      # trace at all, which is what made the stale-fake bug above cost hours
      # instead of one log line. Pins: both guard sites warn; rate limited to
      # once per 10 min per (site, exception type) so a persistent failure
      # cannot flood the log while a NEW failure mode still surfaces on its
      # first occurrence; monotonic() so a wall-clock jump cannot mute it;
      # and the logger never raises inside the guard it reports on.
      # Hermetic: fake logger + injected clock, no DB, no network.
      - name: swallowed render-killer logging (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_silent_guard_logging.py -q
      # Paused-walker declaration durability (new 2026-10-14).
      # supply_escrow_walker was paused and its "paused, intentional" note was
      # written STRAIGHT TO THE DB - it had never been in the seeder at all.
      # That is not just undocumented: seed_walker_scope_declarations.main()
      # computes `stale = existing - valid_names` from SCOPES and DELETEs every
      # DB row not listed there, so the next seeder run would have purged the
      # hand-written row and silently reverted the walker to UNDECLARED on
      # /coverage. Pins: the entry exists, it is inside the same valid_names set
      # the purge arm spares, it declares itself PAUSED/intentional, the note
      # keeps WHY (the 90.9 -> 23.7 pages/s degradation) plus the disclosure and
      # restore path, honest_partial is True, names are unique, and every entry
      # is a well-formed 4-tuple so main() cannot blow up mid-run AFTER purging.
      # Includes a guard-the-guard test so an emptied SCOPES cannot pass
      # vacuously.
      # Hermetic: inspects SCOPES in memory, main() never called, no DB.
      - name: paused walker scope declaration (no DB, no network)
        env:
          DATABASE_URL: ""
        run: pytest tests/test_walker_scope_declarations_paused.py -q
      # Daemon log capper (new 2026-10-14). newsyslog rotates launchd_logs by
      # RENAME, which is right for the ~163 periodic walkers (launchd reopens
      # the path each spawn) and WRONG for a continuously-running job, whose
      # descriptor launchd opened once: after a rename it keeps writing into
      # the renamed inode while the live path stays empty forever. Proven with
