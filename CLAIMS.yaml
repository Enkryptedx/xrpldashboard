          the gateway_address rendered in the scope-note moves with it
          (via context var, not hard-coded). Rotation-history bootstrap
          date (2026-06-08) is a copy-class fact — will silently rot if
          the walker is ever re-bootstrapped from an earlier ledger.
          "Other bridges out of scope" clause is the moat against citation
          creep — if FXRP/Squid/Wormhole NTT ever land in named_accounts
          with category='bridge', this claim must move with them.

      - id: sidechain_freshness_walker_based
        label: "Freshness pill tracks walker_health.last_success_at (not the table's written_at) — SignerListSet rotations are rare, so written_at would misread as 'months ago' when the walker is working"
        data_paths:
          - "app.py:sidechain() — walker_health lookup for bridge_signer_walker"
          - "templates/sidechain.html: age pill"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          This is the correct freshness semantic for a rare-event
          table but a footgun if copied to a high-write table without
          thought — copying the same pattern to /whales would hide
          data-write staleness because both walker and table update
          frequently. Rare-event tables only.

      - id: sidechain_rotation_history
        label: "Historical SignerListSet rotations rendered as an audit trail"
        data_paths:
          - "db.py:read_bridge_signer_rotations()"
          - "templates/sidechain.html: rotations table"
        behavior: MONOTONIC_GROW
        layer3_source: xrpl-transaction-history
        risk_note: >
          Rotations reflect on-chain SignerListSet events. If Axelar
          rotates via a different mechanism in the future (e.g., a
          smart-contract-mediated update on the EVM side), the on-chain
          record here would show a stale set while the actual verifier
          set has moved. Watch for cross-chain rotation-model changes.

  # ─────────────────────────────────────────────────────────────────
  /walker_health:
    template: templates/walker_health.html
    route: "app.py:walker_health_page()"
    claims:

      - id: walker_health_localhost_only_access
        label: "Route 404s for any request not originating from 127.0.0.1 / ::1 — on Render behind the proxy this is never reachable from the internet; on the Mac it's available at localhost:PORT/walker_health with no token"
        data_paths:
          - "app.py:walker_health_page() — request.remote_addr guard"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Load-bearing security property. If Render's proxy ever
          forwards the client IP as remote_addr (e.g., a config change
          that strips the proxy layer), this page would become publicly
          reachable. Any change to the request.remote_addr check must
          be reviewed against the CF proxy config — the same class of
          concern as CF_shared_secret and CF_Connecting_IP trust.

      - id: walker_health_severity_per_walker_cadence
        label: "Row severity (green/yellow/red/idle) computed from each walker's declared cadence_seconds — not from page-wide hardcoded thresholds"
        data_paths:
          - "app.py:_walker_severity()"
          - "db.py:write_walker_health_start(cadence_seconds=...)"
          - "templates/walker_health.html: severity column"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Severity honesty depends on every walker calling
          write_walker_health_start with its actual cadence. A walker
          that omits cadence_seconds shows as idle-or-green when it
          could be broken. Sunday audit sweeps should verify
          cadence_seconds is populated for every row.

  # ─────────────────────────────────────────────────────────────────
  /credentials:
    template: templates/credentials.html
    route: "app.py:credentials()"
    claims:

      - id: credentials_xls70_snapshot
        label: "XLS-70 Credentials state (issued/pending/revoked) rendered from credentials_walker snapshot, refreshed every ~30 minutes under launchd"
        data_paths:
          - "app.py:credentials() — get_credentials_state()"
          - "credentials_walker.py"
          - "templates/credentials.html: credentials section"
        behavior: CONTINUOUS_WIGGLE
        layer3_source: xrpl-credentials-rpc
        risk_note: >
          Adoption is sparse enough that in-request ledger_data walk is
          infeasible. Snapshot-based. If credentials_walker stops running
          (walker_health should catch this), the page silently serves
          stale state — the walker_health freshness surface is the
          backstop.

      - id: credentials_permissioned_domains_seed_scope
        label: "PermissionedDomains (XLS-80) rendered against a 14-account institutional seed — scope is declared, not exhaustive"
        data_paths:
          - "app.py:credentials() — db.read_permissioned_domains_latest()"
          - "permissioned_domains_walker.py"
          - "seed_walker_scope_declarations.py"
          - "templates/credentials.html: permissioned domains section"
        behavior: MANUAL_CURATION
        layer3_source: xrpl-account-objects
        risk_note: >
          Scope is 14 institutional accounts, not the full network.
          Template must surface "curated seed" framing so readers do
          not misread the count as "all PermissionedDomains on XRPL."
          If the seed list expands, the copy needs to move with it.
          Handoff to seed_walker_scope_declarations.py for the
          authoritative address list.

      - id: credentials_walker_stale_threshold
        label: "PermissionedDomains walker rows >48h old surface as 'stale' — daily cadence, 2x-cadence stale threshold"
        data_paths:
          - "app.py:credentials() — perm_walker_is_stale computation"
          - "templates/credentials.html: staleness label"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          48h threshold is 2× the 86400s (daily) walker cadence. If
          the walker cadence is ever changed (e.g., to 12h), the 48h
          constant here becomes wrong — either too tight (false
          staleness) or too loose (hides real staleness). Cadence
          change must move both constants together.

  # ─────────────────────────────────────────────────────────────────
  /price-data:
    template: templates/price_data.html
    route: "app.py:price_data()"
    claims:

      - id: price_data_xls47_oracle_snapshot
        label: "XLS-47 PriceOracle production feed on mainnet, decoded and dated — oracle_walker.py writes oracles_snapshot; page reads via oracle_snapshot.fetch_oracle_snapshot_cached() with 5-min TTL"
        data_paths:
          - "app.py:price_data() — fetch_oracle_snapshot_cached()"
          - "oracle_walker.py"
          - "oracle_snapshot.py"
          - "templates/price_data.html: feed section"
        behavior: CONTINUOUS_WIGGLE
        layer3_source: xrpl-priceoracle-rpc
        risk_note: >
          Framed as "here is the one production feed" — not as a
          directory. XRPLWin runs the full raw directory (linked in
          template); we curate for signal quality. If a second
          production-grade oracle appears, the "the one" framing
          silently drifts to wrong. Recheck when oracle adoption
          crosses a second real issuer.

      - id: price_data_never_touches_node
        label: "Route never touches the XRPL node — snapshot-based read only, so a stalled node does not slow /price-data"
        data_paths:
          - "app.py:price_data() — fetch_oracle_snapshot_cached() only"
          - "oracle_snapshot.py — no rippled RPC in cached read path"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Load-bearing perf property. If the route ever falls back to
          a live RPC read on cache-miss, page-load-under-node-load
          becomes possible — same class of failure that pushed
          /whales toward the warmer pattern. Cache-miss must resolve
          to snapshot-null, not to RPC.

  # ─────────────────────────────────────────────────────────────────
  # Machine-readable surfaces (Agent Tier — Day 1 Discovery Layer)
  # Title-is-contract with extra teeth: every promise these files
  # make is executed literally by a machine reader.
  # ─────────────────────────────────────────────────────────────────
  /llms.txt:
    route: "app.py:llms_txt()"
    claims:

      - id: llms_txt_link_resolvability
        label: "Every URL listed in /llms.txt resolves to a live public surface (200 or documented redirect)."
        data_paths:
          - "app.py:_LLMS_TXT (module-level string)"
          - "app.py:PUBLIC_ROUTES + individual @app.route decorators for /rlusd /whales /rwa /tokens /mpts /pools /analytics /coverage /lending /regulation /check /cold-storage /methodology /about /health /terms /privacy"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          FOUNDING CASE for the machine-reader class. If any listed
          route is renamed, removed, or gated, the _LLMS_TXT string
          moves in the SAME commit. Sibling of the whale-title /
          escrow-copy founding cases, with sharper stakes: humans skim
          past a broken link; an agent may take a 404 as evidence of
          site instability and back off future reads.

      - id: llms_txt_freshness_stamp
        label: "'Last verified <date>' line reflects LAST_VERIFIED_AGENT_TIER_METHODOLOGY, the single source of truth for the agent-tier discovery layer."
        data_paths:
          - "app.py:LAST_VERIFIED_AGENT_TIER_METHODOLOGY (single source)"
          - "app.py:_LLMS_TXT (interpolates the constant via f-string)"
          - "app.py:_AGENTS_JSON.last_verified (reads the constant)"
          - "templates/methodology.html §For AI agents (reads via inject_agent_tier_freshness context_processor)"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Three surfaces read from one constant. Bump
          LAST_VERIFIED_AGENT_TIER_METHODOLOGY on every agent-tier
          surface change, all three refresh. Any surface reading a
          different date than the other two = defect in this wiring;
          fix by re-pointing the drifted surface at the constant.

      - id: llms_txt_no_metric_claims
        label: "/llms.txt does not itself claim any numeric fact — it is a directory only."
        data_paths:
          - "app.py:_LLMS_TXT"
        behavior: LEGITIMATELY_FLAT
        layer3_source: self-attested-only
        risk_note: >
          If a future edit tries to embed a number ("N whale events
          today", "M tokens tracked"), promote it to a real numeric
          claim with its own data_path — do not let un-audited numbers
          land in the discovery-layer file.

  /.well-known/agents.json:
    route: "app.py:agents_json()"
    claims:

      - id: agents_json_status_booleans_are_true
        label: "status.mcp_ready / status.openapi_ready / status.flows_ready reflect actual live-endpoint responsiveness."
        data_paths:
          - "app.py:_AGENTS_JSON (status block)"
          - "docs/AGENT_TIER_DESIGN.md (Day 1-6 sequence)"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Load-bearing honesty. Each boolean flips true ONLY in the
          same commit that ships the corresponding surface. A `true`
          flag with no live endpoint behind it is worse than a `false`
          flag — an agent that trusts `mcp_ready:true` and finds no
          MCP endpoint will treat this domain as unstable and back off.

      - id: agents_json_rate_limits_match_enforcement
        label: "Declared rate limits (60/300) match what flask-limiter actually enforces on agent-tier routes."
        data_paths:
          - "app.py:_AGENTS_JSON (rate_limits block)"
          - "agent_tier_rate_limit.py:agent_tier_limit_rate() (source of truth for enforced values)"
          - "app.py: @limiter.limit(agent_tier_limit_rate) decorators on 8 agent-tier routes"
          - "tests/test_agent_tier_rate_limit.py:test_agents_json_rate_limit_copy_matches_module (regression guard)"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Enforcement shipped Day 6 (2026-08-02). Anonymous = 60/min,
          identified AI-crawler UA = 300/min, both per-IP via CF-
          Connecting-IP. Contract stays live via the paired regression
          test that reads the module's default-rate strings and asserts
          the two "60"/"300" substrings appear in agents.json rate_limits
          copy. Any future change to agent_tier_limit_rate() defaults
          MUST update _AGENTS_JSON.rate_limits and methodology.html's
          "For AI agents" rate-limits block in the same commit — the
          test guards the numeric match but not the surrounding prose.

      - id: agents_json_receipts_envelope_shape
        label: "The receipts_envelope.shape here matches what MCP tools + API endpoints actually return."
        data_paths:
          - "app.py:_AGENTS_JSON (receipts_envelope block)"
          - "docs/AGENT_TIER_DESIGN.md (proof-annotation spec)"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Envelope spec is the differentiator (see design-doc "The
          one thesis"). Every MCP tool / API endpoint must produce
          objects that satisfy this shape. Divergence between the
          declared envelope and shipped payloads breaks agent
          verification — same class of failure as an unresolved
          /llms.txt link, sharper stakes.

      - id: agents_json_trust_surface_urls_live
        label: "Every URL under trust_surfaces resolves to a live endpoint (200 or documented redirect)."
        data_paths:
          - "app.py:_AGENTS_JSON (trust_surfaces block)"
          - "app.py routes: /methodology, /.well-known/snapshots/chain.json, /.well-known/snapshots/pubkey.pem, /.well-known/security.txt, /llms.txt"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Same class as llms_txt_link_resolvability. If any trust
          surface moves, the URL here moves in the same commit.

  # /methodology page already catalogued elsewhere (Phase 4 backlog).
  # The Day 1 "For AI agents" section adds its own claim block here.
  /methodology#for-ai-agents:
    route: "app.py:3135 methodology() -> templates/methodology.html §For AI agents"
    claims:

      - id: methodology_for_ai_agents_envelope_matches_agents_json
        label: "Receipts envelope shown in /methodology#for-ai-agents matches _AGENTS_JSON.receipts_envelope.shape byte-for-byte-equivalent."
        data_paths:
          - "templates/methodology.html §For AI agents (envelope <pre> block)"
          - "app.py:_AGENTS_JSON.receipts_envelope"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Two surfaces publishing the SAME contract. If one is edited
          without the other, agents that check both will detect the
          mismatch and lose trust. Any envelope change moves in ONE
          commit touching both files.

      - id: methodology_for_ai_agents_rate_limits_match_agents_json
        label: "Rate-limit numbers in /methodology#for-ai-agents match _AGENTS_JSON.rate_limits."
        data_paths:
          - "templates/methodology.html §For AI agents (rate-limits <ul>)"
          - "app.py:_AGENTS_JSON.rate_limits"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Sibling to methodology_for_ai_agents_envelope_matches_agents_json.
          Any rate-limit copy edit moves both surfaces in one commit,
          and pairs with the flask-limiter enforcement change
          (agents_json_rate_limits_match_enforcement).

      - id: methodology_mcp_envelope_anchors_resolve
        label: "Every methodology_url cited in an MCP tool envelope resolves to a real element on /methodology (contract per AGENT_TIER_DESIGN.md:410)."
        data_paths:
          - "mcp_tools_ledger.py: methodology_url arguments (#ledger, #amendments, #unl)"
          - "mcp_tools_value_flows.py: methodology_url arguments (#whales, #rlusd)"
          - "mcp_tools_amm_tokens.py: methodology_url arguments (#amm, #token-attestation, #rwa, #mpt)"
          - "mcp_tools_signed_snapshot.py: methodology_url arguments (#signed-snapshot)"
          - "templates/methodology.html §MCP tool envelope sources (h3 ids: ledger, amendments, unl, whales, rlusd, amm, token-attestation, rwa, mpt, signed-snapshot)"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Envelope contract from AGENT_TIER_DESIGN.md:410 ("Every
          methodology_url resolves. Simple HTTP head-check on all URLs
          referenced in envelopes."). Discovered violated during the
          2026-07-31 anchor audit — 5 anchors were being emitted by
          Day 2/3 tools with no matching id on /methodology. Fixed by
          landing the "MCP tool envelope sources" h2 with 5 h3 anchor
          targets, extended to 9 with Day 4 (amm, token-attestation,
          rwa, mpt), and to 10 with Day 7 (signed-snapshot, singular —
          the sibling human-facing #signed-snapshots h2 further up the
          page carries the deep-dive on the chain design). If a future
          tool ships with a new methodology_url, the corresponding h3
          must land in the SAME commit or the envelope's contract
          silently breaks. See sibling
          methodology_for_ai_agents_discovery_links_resolve.

      - id: mcp_third_party_naming_dispute_url_present
        label: "Every MCP tool whose data payload names a third party (issuer attestation, RWA family attribution) carries `dispute_contact_url` in the data payload."
        data_paths:
          - "mcp_tools_amm_tokens.py:tool_get_token_attestation (data.dispute_contact_url)"
          - "mcp_tools_amm_tokens.py:tool_get_rwa_families (data.dispute_contact_url)"
          - "mcp_tools_amm_tokens.py:tool_get_rwa_pools (data.dispute_contact_url)"
          - "mcp_tools_amm_tokens.py:DISPUTE_CONTACT_URL"
          - "app.py:CONTACT_PURPOSES (attestation-dispute)"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Third-party-naming discipline (Day 4). Any tool that assigns a
          name / tier / attribution to an address the site did not
          originate must expose a first-party correction channel — same
          rule the /tokens per-row footer link and /rwa page-level footer
          apply to human readers. If CONTACT_PURPOSES rename drops the
          `attestation-dispute` key, both the on-page footer and the MCP
          data-payload URL 404 in the same way, so a single fix closes
          both surfaces. Adjacent to attestation-dispute-correction-path
          project memory (16cebf4).

      - id: methodology_for_ai_agents_discovery_links_resolve
        label: "All discovery-surface links in /methodology#for-ai-agents (llms.txt, agents.json, snapshot chain/pubkey, security.txt, design-doc GitHub URL) resolve 200."
        data_paths:
          - "templates/methodology.html §For AI agents (Discovery surfaces + Signed-snapshot verification blocks)"
          - "app.py routes: /llms.txt, /.well-known/agents.json, /.well-known/snapshots/chain.json, /.well-known/snapshots/pubkey.pem, /.well-known/security.txt"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Same load-bearing-links class as llms_txt_link_resolvability
          and agents_json_trust_surface_urls_live. Third surface in
          the discovery layer promising URL resolution.

      - id: methodology_for_ai_agents_free_v1_promise
        label: "'Free at v1' framing accurately describes the current state (no accounts, no keys, no payment rails)."
        data_paths:
          - "templates/methodology.html §For AI agents (Why this is free block)"
          - "docs/AGENT_TIER_DESIGN.md (scope contract)"
        behavior: MANUAL_CURATION
        layer3_source: self-attested-only
        risk_note: >
          Copy-class claim on the paid-tier gate. If the paid-tier
          decision fires (attorney answer + demand telemetry both
          clear), this copy must move to reflect the paid surface
          BEFORE any endpoint starts charging. Sibling of the
          whale-title / escrow-copy founding cases.

  # ─────────────────────────────────────────────────────────────────
  # MCP tool surface — one claim per tool's `claims_ref` envelope field
  # ─────────────────────────────────────────────────────────────────
  # Added 2026-08-02 (Day 7 verification-bar close). Each MCP tool sets
  # `claims_ref=<id>` in its envelope; this block is the audit trail
  # naming the source table/walker + the check that would catch a lie.
  # Note: `rlusd_xrpl_net_change_24h` (used by get_rlusd_flow_24h) is
  # already catalogued under /rlusd — the tool reuses the on-page claim
  # id because the fact IS the same fact; no duplicate entry here.

  /mcp:
    route: "mcp_server.py (stdio + optional HTTP; wraps every tool via wrap_envelope)"
    claims:

      - id: ledger_stats_live
        label: "get_ledger_stats returns live server_info fields (validated ledger, close time, server_state, load_factor, complete_ledgers, build_version, hostid) from the local rippled."
        data_paths:
          - "mcp_tools_ledger.py:tool_get_ledger_stats"
          - "mcp_tools_ledger.py:_fetch_server_info (env XRPL_LOCAL_NODE → localhost:5005 default)"
          - "rippled server_info RPC"
        behavior: DAILY_WIGGLE
        layer3_source: local_rippled_server_info
        risk_note: >
          Live-RPC tool with ≤5min freshness contract. If XRPL_LOCAL_NODE
          points at a stale/unhealthy node, envelope's `server_state` and
          `close_time_iso` are the ground-truth check — an agent seeing
          `server_state != 'full'` or a close_time older than a few
          minutes has the honest signal to downweight. Envelope's
          `source: local_rippled` names which node answered.

      - id: amendments_active_count
        label: "get_amendment_status returns enabled/in-flight/superseded counts + hashes from the Amendments ledger object, with cross_check_status derived against the responding node's feature-RPC view."
        data_paths:
          - "mcp_tools_ledger.py:tool_get_amendment_status"
          - "amendments_state.fetch_amendments_state_cached (300s cache; same one /amendments reads)"
          - "cross_check_walker.py: cross_check_pair_4 (localhost feature vs mainnet Amendments ledger object on s1)"
        behavior: STEP_CHANGE
        layer2_rules: [R6]  # amendment-count-drift detected by cross_check_pair_4
        layer3_source: xrpl_amendments_ledger_object
        risk_note: >
          Cross-check is the moat: unrecognized-enabled hashes present in
          the ledger object but not in the responding node's build produce
          `cross_check_status='disagree'` in the envelope. Any silent
          divergence between /amendments on-page counts and this tool's
          `enabled_count` would surface here + on the /amendments claim
          `amendments_enabled_count` (line 503) — same fact, two readers.

      - id: unl_composition
        label: "get_unl_status returns both canonical UNL lists (vl.ripple.com + vl.xrplf.org) with per-list validator counts, expiration, and overlap; honest_partial=True when one fetch failed."
        data_paths:
          - "mcp_tools_ledger.py:tool_get_unl_status"
          - "network_state.fetch_network_state_cached (10min cache; same one /network reads)"
          - "cross_check_walker.py: cross_check_pair_5 (live vl fetch vs stored unl_snapshots)"
        behavior: STEP_CHANGE
        layer3_source: vl_ripple_com_vl_xrplf_org
        risk_note: >
          Honest-partial routing is the escape hatch — if one list fetch
          failed, envelope carries `honest_partial=True` + a scope_note
          naming which list is missing. An agent reading `honest_partial`
          knows to treat `overlap` as unavailable, not fabricated. Same
          two-source honesty the /network page publishes
          (network_unl_counts, line 552).

      - id: whale_events_recent
        label: "get_whale_events returns the last N XRP-denominated whale events + tagged-watchlist rows from the xrpl_stream capture feed, filtered so large_xfer rows satisfy the published whale_threshold_drops."
        data_paths:
          - "mcp_tools_value_flows.py:tool_get_whale_events (WHALE_XRP_THRESHOLD_DROPS=100k XRP; Python-filters large_xfer rows to match published metadata)"
          - "db.py:read_recent_events (returns walker-captured rows, tagged_floor_drops=100 XRP)"
          - "xrpl_stream.py:WHALE_XRP_THRESHOLD_DROPS (walker capture floor, default 50k XRP)"
          - "xrpl_stream.py:49 XRPL_WS_NODE='wss://s2.ripple.com' — stream upstream (public WS, not local rippled)"
        behavior: DAILY_WIGGLE
        layer3_source: public_ws_stream_capture
        scope_note: >
          Layer 3 tier flipped green→yellow on 2026-08-06 sovereignty
          honesty check: the "local xrpl_stream" phrase in the previous
          label meant "captured by our walker", but the upstream feed
          xrpl_stream subscribes to is hardcoded to wss://s2.ripple.com
          (public Ripple node), not the local rippled. Data is still
          our own persisted capture, but the origin observation is a
          public node. Returns to green when the stream repoints at
          our own local WS endpoint (Batch B post-soak).
        risk_note: >
          Same feed the homepage globe pulse + /whales card read; envelope
          makes the source explicit. Thresholds are named in the payload
          (whale_threshold_drops, tagged_floor_drops) so an agent doesn't
          have to guess where the cutoff is. If xrpl_stream dies,
          walker_health.mcp_server_last_tool_call goes stale within one
          cadence — the Q1 heartbeat-gap watermark is the ground-truth
          check.

      - id: whale_watchlist_recent
        label: "get_whale_watchlist returns the last N tagged-watchlist events (type='tagged'), floored at TAGGED_XRP_FLOOR_DROPS for XRP-denominated rows."
        data_paths:
          - "mcp_tools_value_flows.py:tool_get_whale_watchlist"
          - "db.py:read_recent_events (fetches 3× requested limit, Python-filters to type='tagged')"
          - "app.py: named_accounts.json (tag source)"
          - "xrpl_stream.py:49 XRPL_WS_NODE='wss://s2.ripple.com' — same stream feed as whale_events_recent"
        behavior: DAILY_WIGGLE
        layer3_source: public_ws_stream_capture
        scope_note: >
          Same tier flip + reason as whale_events_recent — this claim
          reads the same walker-captured stream, filtered to type=
          'tagged'. Returns to green when xrpl_stream repoints at
          local rippled WS (Batch B).
        risk_note: >
          Same feed as whale_events_recent, filtered to type='tagged'
          rows. The payload's `note` field surfaces the honest-partial
          around token-denominated rows: amount_drops IS NULL rows bypass
          the XRP floor, so an agent needing USD-priced sizing must join
          against the token-price oracle themselves. Absence-is-signal
          documented on the payload, not silent.

      - id: rlusd_supply_cross_chain
        label: "get_rlusd_supply returns cross-chain RLUSD supply (Ethereum + XRPL); honest_partial=True with scope_note when either chain fetch errored — cross-chain total only computed when both sides present."
        data_paths:
          - "mcp_tools_value_flows.py:tool_get_rlusd_supply"
          - "rlusd_live.fetch_state (5min cache; same one /rlusd reads)"
          - "db.py:read_rlusd_state_cache (PG mirror written by rlusd_refresher walker)"
        behavior: STEP_CHANGE
        layer3_source: ethereum_public_rpc+xrpl_public_rpc
        risk_note: >
          cross_check_status='not_applicable' by design — the two chains
          measure independent issuance pools, not the same fact from two
          sources, so agree/disagree is category-inapplicable. The
          finalized-window flow tool (get_rlusd_flow_24h → claims_ref
          `rlusd_xrpl_net_change_24h`) is where cross-check exercises
          real paired data. If either chain errors, `total_supply` is
          null and scope_note names the reason — never a fabricated sum.

      - id: amm_pool_by_address
        label: "get_amm_pool returns one ranked-pool row from amm_ranked_pools for a supplied amm_account; raises when the account isn't in the current snapshot."
        data_paths:
          - "mcp_tools_amm_tokens.py:tool_get_amm_pool"
          - "db.py:read_amm_ranked_pools (writer: rank_amms_walker + amm_tvl_recorder)"
          - "templates/pools.html: same source"
        behavior: DAILY_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          Absence IS the signal — unranked AMMs (below TVL thresholds,
          newer than the last snapshot) raise rather than stubbing a
          zero row. Same fact as the /pools page's ranked list
          (pools_tvl_and_ranking, line 473). If rank_amms_walker dies,
          walker_health.rank_amms marks stale; the tool still returns
          the last successful snapshot with its snapshot_ts_iso — an
          agent checking freshness against `≤ 30min` contract sees the
          drift.

      - id: amm_top_by_tvl_rank
        label: "get_amm_top_by_tvl returns the top-N ranked pools by tvl_usd from the same amm_ranked_pools snapshot; NULL tvl_usd rows sort last."
        data_paths:
          - "mcp_tools_amm_tokens.py:tool_get_amm_top_by_tvl"
          - "db.py:read_amm_ranked_pools (writer: rank_amms_walker + amm_tvl_recorder)"
          - "db.py:read_amm_snapshot_ts (snapshot freshness marker)"
        behavior: DAILY_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          Same source as amm_pool_by_address; payload includes
          `snapshot_ts_iso` so an agent can cross-check the envelope's
          `as_of` field against the underlying snapshot age. If the
          two disagree by more than the freshness contract, the walker
          is behind and the payload is honest about it. Row shape
          mirrors what /pools renders — divergence would break both
          surfaces the same way.

      - id: token_attestation_status
        label: "get_token_attestation returns the attestation tier (verified / self-described / null) for one (currency, issuer) pair from account_labels; carries dispute_contact_url."
        data_paths:
          - "mcp_tools_amm_tokens.py:tool_get_token_attestation"
          - "mcp_tools_amm_tokens.py:_classify_attestation_tier (mirrors app.py:2589-2598 tier ladder)"
          - "db.py:read_account_labels (writer: verify_toml_accounts + enrich_token_names)"
          - "mcp_tools_amm_tokens.py:DISPUTE_CONTACT_URL"
        behavior: DAILY_WIGGLE
        layer3_source: toml_attested
        risk_note: >
          Third-party-naming tool. Payload carries `dispute_contact_url`
          (routes to /contact?purpose=attestation-dispute) so any issuer
          disagreeing with the label has a first-party correction
          channel — same rule the /tokens footer applies to humans
          (mcp_third_party_naming_dispute_url_present, line 1458).
          Absence IS signal: `attestation_tier=null` + reason names why
          (no row / no name field) — never fabricated.

      - id: rwa_families_count
        label: "get_rwa_families returns every rwa_family row + attributed pool count; carries dispute_contact_url."
        data_paths:
          - "mcp_tools_amm_tokens.py:tool_get_rwa_families"
          - "db.py:read_rwa_families"
          - "app.py: /rwa page (rwa_issuer_families, line 675)"
        behavior: DAILY_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          Third-party-naming tool — every family name is a label the site
          assigned to an issuer. Payload's `dispute_contact_url` is the
          correction channel; same rule as token_attestation_status.
          Family count divergence with /rwa page (rwa_issuer_families,
          line 675) would surface here the same way the on-page
          claim's audit would catch it.

      - id: rwa_pools_attributed_count
        label: "get_rwa_pools returns every attributed RWA pool with provenance + TVL (joined against amm_ranked_pools); carries dispute_contact_url."
        data_paths:
          - "mcp_tools_amm_tokens.py:tool_get_rwa_pools"
          - "db.py:read_rwa_pools_attributed"
          - "app.py: /rwa page (rwa_on_chain_liquidity, line 689)"
        behavior: DAILY_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          Third-party-naming tool. Payload carries provenance per pool
          (family_slug, confidence, notes) so an agent reading a pool's
          RWA attribution can inspect the basis, not just the label.
          dispute_contact_url completes the correction path. Same source
          as rwa_on_chain_liquidity (/rwa page); a mismatch between the
          two would be a walker-write or DB-read bug, not a scope
          question.

      - id: mpt_active_count
        label: "get_mpt_snapshot returns total_active MPTs + by_class breakdown from the mpt_snapshot table (writer: mpt_snapshot + mpt_holders_refresh)."
        data_paths:
          - "mcp_tools_amm_tokens.py:tool_get_mpt_snapshot"
          - "db.py:read_mpt_snapshot"
          - "app.py: /mpts page (mpts_issuance_count, line 631)"
        behavior: DAILY_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          Not third-party-naming — reports what the ledger contains
          without opinion on issuer identity. Payload's
          `snapshot_age_seconds` is the freshness proof; if the walker
          hasn't produced a snapshot yet the tool raises rather than
          returning a stub. Same source as mpts_issuance_count on /mpts
          (line 631) — walker death shows on both surfaces via
          walker_health.mpt_snapshot.

      - id: signed_snapshot_daily
        label: "get_signed_snapshot returns the Ed25519-signed daily snapshot for a given ISO date + the Merkle audit path against the chain root (writer: signed_snapshot_walker / signed_snapshot.sign_snapshot)."
        data_paths:
          - "mcp_tools_signed_snapshot.py:tool_get_signed_snapshot"
          - "signed_snapshot.py:sign_snapshot"
          - "signed_snapshots/<date>.json (on-disk source of truth)"
        behavior: STEP_CHANGE
        layer3_source: cryptographic-signature
        risk_note: >
          Absence IS the signal: if the walker has not produced today's
          snapshot yet, or the date predates the chain start, the tool
          raises rather than returning a stub. Payload is a
          pass-through of the on-disk signed envelope (leaf_hash,
          chain_root, previous_root, audit_path, signature_ed25519,
          signing_pubkey_fingerprint) — an agent can hand this straight
          back into verify_snapshot_signature and complete the
          round-trip receipt. Pinned pubkey served at
          /.well-known/snapshots/pubkey.pem; chain served at
          /.well-known/snapshots/chain.json.

      - id: signed_snapshot_verify
        label: "verify_snapshot_signature is stateless — re-derives leaf hash, checks Ed25519 signature against pinned pubkey, checks audit path against chain root, returns verify_result:bool + public_key_fingerprint + issues[]."
        data_paths:
          - "mcp_tools_signed_snapshot.py:tool_verify_snapshot_signature"
          - "signed_snapshot.py:verify_envelope"
          - "signed_snapshot.py:load_public_key"
        behavior: STEP_CHANGE
        layer3_source: cryptographic-signature
        risk_note: >
          No shared state with the writer, no I/O beyond loading the
          pinned public key — same verification path a third-party
          verifier would run. Accepts either the full MCP envelope
          ({data, proof, server}) or the bare signed payload dict.
          Malformed input (missing required fields, non-dict envelope,
          None) raises rather than returning verify_result=False —
          malformed input is a caller bug, not a verification result.
          Freshness_contract="≤ 5min" reflects in-process stateless
          check, not data staleness.

