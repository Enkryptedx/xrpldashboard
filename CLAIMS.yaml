      - id: analytics_bot_probe_all_time
        label: "Bot probe counts — all-time never zero (probes have run)"
        data_paths:
          - "db.py:read_page_view_stats(kind='bot')"
          - "templates/admin_stats.html:466 Probed paths · 24h"
          - "templates/admin_stats.html:482 Bot countries · 24h"
        behavior: DAILY_WIGGLE
        layer2_rules: [R2]  # all-time = 0 impossible per design taxonomy
        layer3_source: self-attested-only

      - id: analytics_referrer_and_utm
        label: "External referrer + UTM landing counts — attribution reflects real inbound clicks"
        data_paths:
          - "db.py:read_external_referrers"
          - "db.py:read_utm_landings"
          - "templates/admin_stats.html:334 External referrers · 7 days"
          - "templates/admin_stats.html:354 UTM-attributed landings · 7 days"
        behavior: DAILY_WIGGLE
        layer3_source: self-attested-only

      - id: analytics_cta_clicks
        label: "Outbound CTA clicks (/institutional contact) count matches cta_clicks table"
        data_paths:
          - "db.py:read_cta_click_stats"
          - "db.py:read_recent_cta_clicks"
          - "templates/admin_stats.html:382 Outbound clicks · /institutional contact"
        behavior: MONOTONIC_GROW
        layer3_source: self-attested-only

  # ─────────────────────────────────────────────────────────────────
  # Phase 4 — manifest expansion to remaining public pages
  # Catalogued 2026-07-22. Same discipline: needs-trace where data
  # paths are uncertain; founding-case risk_notes where history exists.
  # Interrupt rule was armed — no live-false claims surfaced during
  # this pass that required halting (see full audit run for findings).
  # ─────────────────────────────────────────────────────────────────

  /:
    template: templates/index.html
    route: "app.py:1292 index()"
    claims:

      - id: homepage_amm_pool_tvl
        label: "AMM pool table: TVL figures for each pool from on-chain reserves"
        data_paths:
          - "db.py:read_amm_ranked_pools"
          - "rank_amms walker (5min cadence)"
          - "templates/index.html: AMM pool rows"
        behavior: CONTINUOUS_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          TVL = (xrp_reserves × xrp_price) + (token_reserves × token_price).
          Price is AMM-derived. Between rank_amms cycles, new AMMs
          are absent. If xrp_price stalens, all TVL figures stale
          silently — R3 coverage via rank_amms walker_health.

      - id: homepage_xrp_distribution
        label: "XRP distribution breakdown (escrow / AMM / wallets)"
        data_paths:
          - "templates/index.html: distribution panel"
          - "db.py: (needs-trace — multiple helpers contribute)"
        behavior: DAILY_WIGGLE
        layer3_source: self-attested-only
        needs-trace: true
        risk_note: >
          Distribution figures combine escrow_walker (Ripple cohort only),
          AMM walker, and daily_snapshot. Each source's scope constraints
          propagate silently into the headline. Distribution total must
          sum to ≤ XRP circulating supply; over-count is a live-false
          claim. Scope-partial escrow (Ripple cohort only) is not labeled
          as a limitation in the current UI.

  # ─────────────────────────────────────────────────────────────────
  /tokens:
    template: templates/tokens.html
    route: "app.py:2313 tokens()"
    claims:

      - id: tokens_ranking_scope
        label: "Token ranking covers XRPL DEX trade volume only — no OTC or off-ledger"
        data_paths:
          - "db.py:read_token_volume_aggregates"
          - "db.py:read_token_volume_bucket_stats"
          - "xrpl_stream.py: trade ingest (full firehose)"
          - "templates/tokens.html: ranking table"
        behavior: CONTINUOUS_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          Ranking is XRPL DEX only. Tokens with zero DEX trades are
          absent from ranking (not shown as zero — correct). OTC/off-ledger
          volume is not captured and not disclosed as a limitation on the
          page. If a token is known to have significant off-ledger
          activity, the ranking understates it without disclosure.

      - id: tokens_xrp_price
        label: "Per-token XRP price is the latest AMM-derived cached value"
        data_paths:
          - "db.py:read_token_prices_map"
          - "db.py:read_token_price"
          - "xrpl_stream.py: token_price_ratio_cache (5min TTL)"
          - "templates/tokens.html: price column"
        behavior: CONTINUOUS_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          Price is XRP-denominated from the best AMM pool; USD conversion
          applies xrp_price (AMM/RLUSD). Tokens without an active AMM
          pool show no price — not a zero price. Stale if stream stops
          and cache TTL has not expired.

  # ─────────────────────────────────────────────────────────────────
  /pools:
    template: templates/pools.html
    route: "app.py:4154 pools()"
    claims:

      - id: pools_tvl_and_ranking
        label: "AMM pool TVL and ranking within each tier (top 100/500/all)"
        data_paths:
          - "db.py:read_amm_ranked_pools"
          - "rank_amms walker (5min cadence)"
          - "templates/pools.html: tier display + TVL rows"
        behavior: CONTINUOUS_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          Ranking uses the last rank_amms walker snapshot. New AMMs
          between walk cycles are absent until the next 5-min cycle.
          TVL = on-ledger reserves × prices from token_prices table
          (AMM-derived, 5-min TTL). If a pool's LP token price is
          unavailable, TVL shows partial-only.

      - id: pools_indexed_count
        label: "Count of indexed AMM pools shown in the page header"
        data_paths:
          - "templates/pools.html: indexed-count hero"
          - "app.py:4154 pools() context (amm_count)"
        behavior: MONOTONIC_GROW
        layer2_rules: [R4]
        layer3_source: self-attested-only

  # ─────────────────────────────────────────────────────────────────
  /amendments:
    template: templates/amendments.html
    route: "app.py:3013 amendments()"
    claims:

      - id: amendments_enabled_count
        label: "Hero count: N amendments currently enabled on mainnet"
        data_paths:
          - "amendments_state.py:fetch_amendments_state_cached"
          - "app.py:3013 amendments()"
          - "templates/amendments.html: enabled-count hero"
        behavior: MONOTONIC_GROW
        layer2_rules: [R4]
        layer3_source: xrpl_amendments_ledger_object
        risk_note: >
          Count from the Amendments ledger object (canonical on-chain
          source), not from feature-RPC name matches. Unrecognized
          hashes still count — the code correctly reads the on-ledger
          Amendments field length. Cross-checked by cross_check_walker
          pair amendments_local_vs_mainnet.

      - id: amendments_in_flight
        label: "In-flight list: amendments in the active 14-day Majorities window"
        data_paths:
          - "amendments_state.py:fetch_amendments_state_cached"
          - "templates/amendments.html: in-flight section"
        behavior: STEP_CHANGE
        layer3_source: xrpl_amendments_ledger_object
        risk_note: >
          In-flight = supported by the responding node AND has a Majority
          entry in the Amendments ledger object. Cache TTL=300s max delay
          before new entries surface. An amendment that reaches majority
          while the cache is cold appears absent until next refresh.

      - id: amendments_editorial_summaries
        label: "Plain-English amendment descriptions are factually accurate"
        data_paths:
          - "templates/amendments.html: amendment descriptions"
        behavior: LEGITIMATELY_FLAT
        layer3_source: self-attested-only
        needs-trace: true
        risk_note: >
          Hand-authored copy per amendment. No automated comparison to
          xrpl.org/known-amendments. Re-verify on every content pass
          (sibling of content_pass_reverify memory). Interrupt-rule class:
          a material factual error in an amendment's description is a
          live-false claim.

  # ─────────────────────────────────────────────────────────────────
  /network:
    template: templates/network.html
    route: "app.py:3065 network()"
    claims:

      - id: network_unl_counts
        label: "Validator count and UNL composition from both Ripple and Foundation lists"
