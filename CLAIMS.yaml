        behavior: LEGITIMATELY_FLAT
        layer3_source: self-attested-only
        risk_note: >
          Charlie's rule: sovereignty tier and revenue tier are the same
          line. If a new NFT surface ever ships on this page, it needs
          a source-pill at point of display or it violates the doctrine.
          Sibling of the whale-title founding-case discipline (label at
          the surface, not deep in methodology).

      - id: nfts_scope_limitations
        label: "Known limitations disclosed: no cross-collection floor prices, no off-chain names, sales-not-priced (buyer/seller/price_drops NULL)"
        data_paths:
