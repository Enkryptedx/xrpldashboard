        behavior: LEGITIMATELY_FLAT
        layer3_source: self-attested-only
        risk_note: >
          Copy-class claim. If NFT scope changes (e.g. adds XLS-46 collections
          or bridged NFTs) the title/H1 must move with it — sibling of the
          whale-title founding case.

      - id: nfts_tx_type_counts_live
        label: "Per-tx-type activity counts (24h + 7d): NFTokenMint, NFTokenAcceptOffer, NFTokenCreateOffer, NFTokenCancelOffer, NFTokenBurn"
        data_paths:
          - "db.pg_connect() + nft_activity table (GROUP BY tx_type, close_time window)"
          - "nft_activity_walker.py: activity mode (5min cadence, 200-ledger batches)"
          - "xrpl_client.py:get_client — local rippled primary, s1/s2 public fallback"
          - "app.py:3365 nfts() — counts_24h + counts_7d + counts_all"
          - "templates/nfts.html: activity-by-tx-type card"
        behavior: CONTINUOUS_WIGGLE
        layer2_rules: [R1, R3]
        layer3_source: local_rippled
        risk_note: >
          Live tx-type counts are the paid-eligible-post-migration surface
          under SELLABLE_REQUIRES_SOVEREIGN_SOURCE (see
          docs/X402_RAILS_DARK_SCOPING.md § Fence #2). Today's forward-walker
          uses xrpl_client's cascade — own rippled first, public s1/s2
          fallback via `xrpl_node_fallback_used=True` when local is down.
          The layer3_source label reflects the intended sovereignty tier;
          walker_health records actual per-run fallback state.

      - id: nfts_historical_backfill_range
        label: "Backfill coverage window: ledger 103,252,853 (2026-04-01) → current head"
        data_paths:
          - "nft_activity_walker.py: backfill mode (s2-clio.ripple.com)"
          - "app.py:3365 nfts() — range_start_ledger + range_end_ledger"
          - "templates/nfts.html: hero range block"
        behavior: MONOTONIC_GROW
        layer3_source: ripple_public_clio_archive
        risk_note: >
          Historical backfill was read from Ripple's public Clio archive
          (s2-clio.ripple.com) — a third-party pipe. Under
          SELLABLE_REQUIRES_SOVEREIGN_SOURCE (Fence #2 / Fence #8 in
          X402_RAILS_DARK_SCOPING.md) this data is filtered OFF the paid
          tier and stays free forever, disclosed with an amber source-pill
          at point of display. Re-derivation from our own full-history
          node is the path to clean title (attorney question 6(d)).

      - id: nfts_backfill_residual_holes
        label: "Backfill coverage disclosure: ~95.6% of range covered, ~129,000 residual holes (Clio 503 windows)"
        data_paths:
          - "app.py:3362 _NFT_BACKFILL_RESIDUAL_HOLES_EST = 129_000"
          - "templates/nfts.html: known-limitations card"
          - "memory: project_xrpldashboard_nft_backfill_gap_audit_2026-08-10.md"
        behavior: LEGITIMATELY_FLAT
        layer3_source: self-attested-only
        risk_note: >
          Founding-case-shaped disclosure: coverage stat, not headline stat.
          The 129K estimate was derived from stratified sampling of missing
          ledgers against s2-clio: 16.1% hole-rate in small-delta gaps,
          35.7% in large-delta gaps, weighted ~4.4% of the range. If this
          number ever moves without a documented sampling round + memory
          update, it has become fiction.

