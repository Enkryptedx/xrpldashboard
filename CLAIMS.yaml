          - "templates/nfts.html: hero freshness chip"
        behavior: CONTINUOUS_WIGGLE
        layer3_source: self-attested-only
        risk_note: >
          If activity-mode walker stops but the page cache holds a value,
          the stamp will keep ticking up. Coverage handoff to R3 via
          walker_health(worker='nft_activity_walker'). Any staleness > cadence×3
